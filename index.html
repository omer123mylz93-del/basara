const defaults=()=>({code:'Öğrenci 01',baseline:{},logs:[],notes:{},retention:[]});let state=defaults();try{const s=JSON.parse(localStorage.getItem('basara-v1'));if(s&&typeof s==='object')state={...defaults(),...s}}catch(e){}let storageOK=true;function save(){try{localStorage.setItem('basara-v1',JSON.stringify(state));storageOK=true}catch(e){storageOK=false;alert('Tarayıcı kaydı yapılamadı. Yedek indirerek veriyi koruyun.')}}
let tab='home',week=1,day=1,deck=[],pos=0,kind='heces',flashResults=[];let baseMode='heces';const navs=[['home','Genel bakış'],['baseline','Başlangıç testi'],['plan','Haftalık plan'],['student','Öğrenci modu'],['track','Takip / kayıt'],['backup','Yedek']];const labels={heces:'Hece okuma',words:'Kelime okuma',sentences:'Cümle okuma',dictH:'Hece diktesi',dictW:'Kelime diktesi',dictS:'Cümle diktesi',meaning:'Anlama',transfer:'Transfer'};const options=[['','—'],['+','Bağımsız doğru'],['-','Yanlış'],['I','İpucuyla'],['C','Cevap yok']];const today=()=>new Date().toLocaleDateString('sv-SE');const getDay=()=>DATA.days[(week-1)*5+day-1];const score=vals=>({n:vals.filter(v=>v).length,good:vals.filter(v=>v==='+').length});const pct=(g,n)=>n?Math.round(g/n*100):0;function chip(a){return `<div class="chips">${a.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`}function section(t,s){return `<h3>${esc(t)}</h3><p>${esc(s)}</p>`}function go(t){tab=t;render();window.scrollTo(0,0)}function choose(w,d=1){week=w;day=d;go('plan')}function pdf(w){const bytes=Uint8Array.from(atob(PDFS[w]),c=>c.charCodeAt(0));download(new Blob([bytes],{type:'application/pdf'}),`Basara_Hafta_${w}.pdf`)}function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function render(){ $('nav').innerHTML=navs.map(([id,t])=>`<button class="${id===tab?'active':''}" onclick="go('${id}')">${t}</button>`).join('');$('app').innerHTML=({home,baseline,plan,student,track,backup}[tab])(); }
function home(){let n=state.logs.length;return `<div class="panel"><div class="eyebrow">Öğrenci profili</div><h2>Bugün nereden başlayalım?</h2><label for="code">Öğrenci kodu (gerçek ad kullanmayın)</label><input id="code" maxlength="40" value="${esc(state.code)}" onchange="state.code=this.value;save()"><div class="buttons"><button class="primary" onclick="go('baseline')">Başlangıç değerlendirmesi</button><button onclick="choose(1)">Ders planına geç</button></div><p class="muted">Kayıtlar yalnız bu tarayıcıda tutulur. Öğrencinin adını, tanısını veya fotoğrafını yüklemeyin.</p></div><div class="grid"><div class="panel"><div class="eyebrow">Program</div><div class="big">20 ders</div>4 hafta · 40 dakika</div><div class="panel"><div class="eyebrow">Kayıtlı yoklama</div><div class="big">${n}</div>Her beceri ayrı ölçülür</div><div class="panel"><div class="eyebrow">Ölçüt</div><div class="big">%90 / %80</div>Okuma / dikte</div></div><h2 style="margin:24px 0 12px">Haftalık yol haritası</h2><div class="grid">${DATA.weeks.map((w,i)=>`<div class="panel"><div class="eyebrow">${i+1}. hafta</div><h3>${esc(w.title)}</h3><p>${esc(w.goal)}</p><div class="buttons"><button class="primary" onclick="choose(${i+1})">Planı aç</button><button onclick="pdf(${i+1})">PDF indir</button></div></div>`).join('')}</div><div class="panel" style="margin-top:16px"><h3>İlerleme kuralı</h3><p>Takvim zorunlu değildir. Hedefleri iki ayrı günde bağımsız ölç; okuma en az 9/10, dikte 8/10; cümle/anlama/transfer 4/5. Öğrenci zorlanırsa aynı basamağı küçült. Ön koşullar sağlanmadıkça yeni heceye geçme.</p><p>Öğretim: model ol → birlikte yap → bağımsız tepki → araya başka madde koy → tekrar yokla. Kalıcılığı 1, 3, 7 ve 14 gün sonra kontrol et.</p></div>`}
const base={heces:DATA.days[0].heces,words:DATA.days[0].words,sentences:DATA.days[0].sentences,dictH:DATA.days[1].heces,dictW:DATA.days[1].words,dictS:DATA.days[1].sentences};function baseline(){const a=base[baseMode],vals=a.map((x,i)=>state.baseline[baseMode+':'+i]||''),sc=score(vals);const weak=a.filter((x,i)=>vals[i]&&vals[i]!=='+');return `<div class="panel"><div class="eyebrow">Başlangıç performansı</div><h2>Öğretimden önce bağımsız yoklama</h2><p>Resim veya renk ipucu verme. 5–10 saniye bekle; gerektiğinde uyarlayabilirsin. Art arda üç zorlanmada güçlük grubunu durdur, sonraki kısa oturumda değerlendir. Dikte sırasında ekranı öğrenciye gösterme.</p><div class="buttons">${Object.keys(base).map(k=>`<button class="${k===baseMode?'active':''}" onclick="baseMode='${k}';render()">${labels[k]}</button>`).join('')}</div><div class="soft"><strong>${sc.good}/${sc.n} bağımsız doğru</strong> · ${a.length-sc.n} madde henüz yoklanmadı. ${sc.n?`(%${pct(sc.good,sc.n)})`:''}</div><div class="tablewrap"><table><thead><tr><th>Madde</th><th>Bağımsız performans</th></tr></thead><tbody>${a.map((x,i)=>`<tr><td style="font-size:22px">${esc(x)}</td><td><select onchange="setBase('${baseMode}',${i},this.value)">${options.map(([v,t])=>`<option value="${v}" ${v===vals[i]?'selected':''}>${t}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div><p><b>Tekrar edilecekler:</b> ${esc(weak.join(', ')||'Henüz işaretlenen yanlış yok.')}</p><p class="muted">Sonuçlar otomatik kaydedilir. Eksik değerlendirilen maddeler başarı yüzdesine dahil edilmez.</p><div class="buttons"><button onclick="startDeck('${baseMode}',true)">Öğrenci kartlarını aç</button><button onclick="window.print()">Yazdır / PDF kaydet</button></div></div><div class="panel"><h3>Başlangıç kararı</h3>${Object.keys(base).map(k=>{const s=score(base[k].map((_,i)=>state.baseline[k+':'+i]||''));return `<p>${labels[k]}: <b>${s.good}/${s.n}</b> ${s.n===base[k].length?'• tamamlandı':'• kısmi/yoklanmadı'}</p>`}).join('')}<p>${esc(recommend())}</p></div>`}function setBase(k,i,v){state.baseline[k+':'+i]=v;save();render()}
function recommend(){const groups=['heces','words','dictH','dictW'];let missing=groups.filter(k=>base[k].some((_,i)=>!state.baseline[k+':'+i]));if(missing.length)return 'Önce başlangıç yoklamasını tamamla; zorlanan grubu ayrı oturumda yeniden değerlendir.';let weak=base.heces.filter((x,i)=>state.baseline['heces:'+i]!=='+');let wh=base.dictH.filter((x,i)=>state.baseline['dictH:'+i]!=='+');if(weak.length||wh.length)return 'Öncelikli heceler: '+[...new Set([...weak,...wh])].join(', ')+'. En fazla iki hedefle başla; okuma ve dikteyi ayrı çalış.';let w=score(base.words.map((_,i)=>state.baseline['words:'+i]));let d=score(base.dictW.map((_,i)=>state.baseline['dictW:'+i]));return pct(w.good,w.n)<90||pct(d.good,d.n)<80?'Heceler doğru; kelime birleştirme veya bağımsız yazma basamağını çalış.':'Temel maddeler iyi; cümle ve genelleme yoklamasına göre uygun basamaktan devam et.'}
function plan(){const w=DATA.weeks[week-1],d=getDay();const timing=d.id===1?'5 dk hazırlık · 8 dk ünlüler · 10 dk heceler · 3 dk mola · 8 dk kelime · 6 dk cümle. Gerekirse iki oturuma böl.':d.id===2?'5 dk hazırlık · 10 dk hece diktesi · 3 dk mola · 10 dk kelime diktesi · 7 dk cümle · 5 dk kopyalama karşılaştırması.':'5 dk eski heceler · 8 dk hedef öğretimi · 7 dk kelime · 3 dk mola · 7 dk cümle/anlama · 7 dk dikte · 3 dk bağımsız yoklama.';return `<div class="buttons noprint">${DATA.weeks.map((_,i)=>`<button class="${week===i+1?'active':''}" onclick="choose(${i+1})">${i+1}. hafta</button>`).join('')}</div><div class="panel"><div class="eyebrow">${week}. hafta</div><h2>${esc(w.title)}</h2><p>${esc(w.goal)}</p><p class="muted">${esc(w.source)}</p><p class="soft">${esc(w.gate)}</p><div class="buttons"><button class="primary" onclick="pdf(${week})">Haftalık PDF indir (13 sayfa)</button><button onclick="window.print()">Bu dersi yazdır</button></div></div><div class="daybar noprint">${[1,2,3,4,5].map(i=>`<button class="${day===i?'active':''}" onclick="day=${i};render()">${i}. gün</button>`).join('')}</div><div class="panel" style="margin-top:12px"><div class="eyebrow">Ders ${d.id} / 20 ${d.assessment?'· değerlendirme':''}</div><h2>${esc(d.title)}</h2>${section('Ders akışı',timing)}${section('Öğretmen yönergesi',d.guidance)}<p class="warn">Yalnız kazanılmış önkoşulları kullan. Yeni hece sayısını 1–2, yeni kelime sayısını 3 ile sınırla. Diğerleri tekrar adayıdır.</p><h3>Hedef heceler</h3>${chip(d.heces)}<div class="buttons"><button onclick="startDeck('heces')">Hece kartları</button></div><h3>Kelime okuma</h3>${chip(d.words)}<div class="buttons"><button onclick="startDeck('words')">Kelime kartları</button></div><h3>Ayırt etme</h3>${chip(d.pairs.map(x=>x.replace('/',' / ')))}<h3 style="margin-top:20px">Cümle okuma</h3>${d.sentences.map(x=>`<div class="readline">${esc(x)}</div>`).join('')}<div class="buttons"><button onclick="startDeck('sentences')">Cümle kartları</button></div>${section('Anlama ve işlevsel kullanım',d.action)}<details><summary>Dikte listesi (yalnız öğretmen)</summary><p>${esc(d.dictation.join(' • ')||'Bu derste ayrı dikte yok.')}</p><p>Kâğıttaki modelin kapalı olduğundan emin ol; önce bağımsız deneme, sonra gerekirse model.</p></details><details><summary>Yeni örnekler / transfer</summary>${chip(d.transfer)}<p class="muted">Yalnız önceden öğretilmemiş ve önkoşulu bilinen maddeler. Anlamsız dizileri ayrı kaydet.</p><button onclick="startDeck('transfer')" ${!d.transfer.length?'disabled':''}>Transfer kartları</button></details><h3>Öğretmen notu</h3><textarea placeholder="Öğrenci nerede takıldı? Sonraki ders için hedef..." oninput="state.notes[${d.id}]=this.value;save()">${esc(state.notes[d.id]||'')}</textarea><div class="buttons"><button class="primary" onclick="go('track')">Ders sonuçlarını kaydet</button></div></div>`}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}let flashBase=false;function startDeck(k,b=false){kind=k;flashBase=b;deck=shuffle((b?base[k]:getDay()[k]).map((text,i)=>({text,i})));pos=0;flashResults=[];go('student')}function student(){if(!deck.length)return `<div class="panel"><h2>Öğrenci kartları</h2><p>Bir ders veya başlangıç testi seç. Kartlar rastgele sırada, ipucusuz ve büyük yazıyla gösterilir.</p><div class="buttons"><button onclick="go('plan')">Ders seç</button><button onclick="go('baseline')">Başlangıç testi</button></div></div>`;if(pos>=deck.length){let s=score(flashResults.map(x=>x.v));return `<div class="panel"><h2>Oturum tamamlandı</h2><div class="big">${s.good}/${s.n}</div><p>Bağımsız doğru · %${pct(s.good,s.n)}</p><p>Tekrar: ${esc(flashResults.filter(x=>x.v!=='+').map(x=>x.text).join(', '))}</p><div class="buttons"><button onclick="startDeck('${kind}',${flashBase})">Yeniden karıştır</button><button onclick="go('${flashBase?'baseline':'track'}')">Kayıtlara dön</button></div><p class="muted">${flashBase?'Başlangıç formuna işlendi.':'Takip alanına geçerek bu sonucu ve diğer becerileri ayrı kaydet.'}</p></div>`}const x=deck[pos],isDict=kind.startsWith('dict');return `<div class="panel"><div class="buttons noprint"><button onclick="go('${flashBase?'baseline':'plan'}')">Öğretmen paneline dön</button><span class="muted">${pos+1}/${deck.length}</span></div><div class="progress"><span style="width:${pos/deck.length*100}%"></span></div><div class="flash ${x.text.length>12?'small':''}" style="margin:18px 0">${isDict?'Dinle ve yaz':esc(x.text)}</div>${isDict?`<details><summary>Öğretmen için dikte maddesi (öğrenci görmemeli)</summary><h3>${esc(x.text)}</h3></details>`:''}<div class="buttons">${options.slice(1).map(([v,t])=>`<button class="${v==='+'?'primary':''}" onclick="markFlash('${v}')">${t}</button>`).join('')}<button onclick="pos++;render()">Atla</button></div><p class="muted">Öğretmen ilk bağımsız tepkiyi işaretler. Öğrenciye cevabı verdikten sonraki tepkiyi bağımsız doğru saymayın.</p></div>`}function markFlash(v){let x=deck[pos];flashResults.push({text:x.text,v});if(flashBase){state.baseline[kind+':'+x.i]=v;save()}pos++;render()}
function track(){const d=getDay(),logs=state.logs.slice().reverse();return `<div class="panel"><h2>Günlük beceri kaydı</h2><p>Seçili ders: <b>${week}. hafta / ${day}. gün — ${esc(d.title)}</b></p><div class="buttons"><button onclick="go('plan')">Ders değiştir</button></div><label>Tarih</label><input id="logdate" type="date" value="${today()}"><label>Hedef grup (iki günlük karşılaştırmada aynı kodu kullan)</label><input id="group" value="${esc(d.heces.join(' '))}"><div class="tablewrap"><table><thead><tr><th>Beceri</th><th>Doğru</th><th>Denenen</th></tr></thead><tbody>${Object.entries(labels).map(([k,l])=>`<tr><td>${l}</td><td><input id="g_${k}" type="number" min="0" max="100" style="width:72px" placeholder="—"></td><td><input id="n_${k}" type="number" min="1" max="100" style="width:72px" placeholder="—"></td></tr>`).join('')}</tbody></table></div><label>Hatalar / ipucu düzeyi</label><textarea id="err" placeholder="Örn. ba ile sa karışıyor; masa yerine mama..."></textarea><button class="primary" onclick="addLog()">Yoklamayı kaydet</button><p class="muted">Yalnız bağımsız doğruları say. Denenmeyen alanı boş bırak. Ölçüt değerlendirmesi için en az 10 hece/kelime; cümle/anlama/transfer için en az 5 madde.</p></div><div class="panel"><h3>Tekrar ve kalıcılık</h3><label>Madde / hedef</label><input id="retItem" placeholder="ba, sa / masa"><label>İlk öğretim tarihi</label><input id="retDate" type="date" value="${today()}"><div class="buttons"><button onclick="addRetention()">1, 3, 7, 14 günlük tekrar oluştur</button></div>${state.retention.map((r,i)=>`<div class="soft" style="margin:8px 0">${esc(r.item)} · ${esc(r.date)} · ${r.offset}. gün <select aria-label="Kalıcılık sonucu" onchange="state.retention[${i}].result=this.value;save();render()">${[['','Bekliyor'],['+','Bağımsız doğru'],['-','Yanlış'],['I','İpucuyla'],['C','Cevap yok']].map(([v,t])=>`<option value="${v}" ${v===r.result?'selected':''}>${t}</option>`).join('')}</select> ${r.date<=today()&&!r.result?' • Bugün veya gecikmiş':''}</div>`).join('')}</div><div class="panel"><h3>Ölçüt kontrolü</h3>${gateStatus()}<p class="muted">Aynı hedef grubunda farklı iki tarihte yeterli veri aranır. Geçiş kararı öğretmene aittir; cümle ve transfer sonuçları da kontrol edilmelidir.</p></div><div class="panel"><h3>Kayıt geçmişi</h3>${logs.length?logs.map(l=>`<details><summary>${esc(l.date)} · Ders ${l.day} · ${esc(l.group)}</summary>${Object.entries(l.scores).map(([k,s])=>`<p>${labels[k]}: <b>${s.g}/${s.n} (%${pct(s.g,s.n)})</b></p>`).join('')}<p>${esc(l.err)}</p><button onclick="deleteLog(${l.id})">Kaydı sil</button></details>`).join(''):'Henüz kayıt yok.'}<div class="buttons"><button onclick="window.print()">Raporu yazdır / PDF kaydet</button></div></div>`}function addLog(){let scores={};for(let k of Object.keys(labels)){let a=$('g_'+k).value,b=$('n_'+k).value;if(a===''&&b==='')continue;let g=Number(a),n=Number(b);if(a===''||b===''||!Number.isInteger(g)||!Number.isInteger(n)||g<0||n<1||g>n||n>100){alert(labels[k]+' için geçerli doğru ve denenen sayı gir.');return}scores[k]={g,n}}if(!Object.keys(scores).length||!$('logdate').value||!$('group').value.trim()){alert('Tarih, hedef ve en az bir beceri gerekli.');return}state.logs.push({id:Date.now(),date:$('logdate').value,day:getDay().id,group:$('group').value.trim(),scores,err:$('err').value});save();render()}function deleteLog(id){if(confirm('Bu kayıt silinsin mi?')){state.logs=state.logs.filter(l=>l.id!==id);save();render()}}function gateStatus(){if(!state.logs.length)return '<p>İki günlük ölçüt için kayıt gerekli.</p>';let grp=state.logs.at(-1).group,ls=state.logs.filter(l=>l.group===grp);let html=`<p>Son hedef: <b>${esc(grp)}</b></p>`;for(let [k,label] of Object.entries(labels)){let min=['sentences','dictS','meaning','transfer'].includes(k)?5:10,threshold=['heces','words'].includes(k)?90:80;let by={};ls.forEach(l=>{if(l.scores[k])by[l.date]=l.scores[k]});let a=Object.entries(by).sort((a,b)=>a[0].localeCompare(b[0])).slice(-2);let pass=a.length===2&&a.every(([,s])=>s.n>=min&&pct(s.g,s.n)>=threshold);html+=`<p>${label}: ${pass?'✓ İki günlük ölçüt karşılandı':a.length?'Tekrar / ek yoklama gerekli':'Henüz ölçülmedi'} ${a.map(([date,s])=>`${esc(date)} ${s.g}/${s.n}`).join(' · ')}</p>`}return html}function addRetention(){let item=$('retItem').value.trim(),date=$('retDate').value;if(!item||!date){alert('Hedef ve tarih girin.');return}for(let offset of [1,3,7,14]){let dt=new Date(date+'T12:00:00');dt.setDate(dt.getDate()+offset);state.retention.push({item,date:dt.toLocaleDateString('sv-SE'),offset,result:''})}save();render()}
function backup(){return `<div class="panel"><h2>Yedekleme ve gizlilik</h2><p>Sunucu hesabı yoktur. Kayıtlar bu tarayıcı ve adresle sınırlıdır; gizli sekmede veya geçmiş temizlendiğinde silinebilir. Yedeği düzenli indirin. Gerçek ad, fotoğraf veya sağlık bilgisi yazmayın. Yedek dosyalarını güvenli saklayın.</p><div class="buttons"><button class="primary" onclick="download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'basara-yedek.json')">JSON yedek indir</button><button onclick="exportCSV()">Kayıtları CSV indir</button></div><label>Yedekten geri yükle (mevcut verilerin yerini alır)</label><input type="file" accept=".json,application/json" onchange="restore(this)"><div class="buttons"><button class="danger" onclick="if(confirm('Bu cihazdaki bütün kayıtlar silinsin mi?')){state=defaults();save();render()}">Yerel verileri sil</button></div></div><div class="panel"><h3>Web sitesinde yayınlama</h3><p>index.html dosyasını bir statik web sunucusuna veya GitHub Pages'e yükleyin. GitHub: Settings → Pages → Deploy from a branch → main / root. Uygulama bağlantısı oluşturulduğunda farklı cihazlarda açılır; kayıtlar otomatik senkronize olmaz.</p><p>Haftalık PDF'ler dosyaya gömülüdür. İnternet olmadan da indirilebilir.</p></div>`}async function restore(input){try{let s=JSON.parse(await input.files[0].text());if(!s||typeof s.code!=='string'||!Array.isArray(s.logs)||!Array.isArray(s.retention)||typeof s.baseline!=='object'||typeof s.notes!=='object'||s.logs.some(l=>!l||typeof l.date!=='string'||typeof l.group!=='string'||!l.scores||!Object.values(l.scores).every(v=>v&&Number.isFinite(v.g)&&Number.isFinite(v.n))))throw Error();if(confirm('Mevcut kayıtların yerini bu yedek alsın mı?')){state={...defaults(),...s};save();render()}}catch(e){alert('Geçerli bir Başara yedeği seçin.')}}function exportCSV(){let safe=v=>{let s=String(v??'');if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};let rows=[['Tarih','Ders','Hedef','Beceri','Bağımsız doğru','Denenen','Not']];for(let l of state.logs)for(let [k,s] of Object.entries(l.scores))rows.push([l.date,l.day,l.group,labels[k],s.g,s.n,l.err]);download(new Blob(['\ufeff'+rows.map(r=>r.map(safe).join(';')).join('\n')],{type:'text/csv;charset=utf-8'}),'basara-kayit.csv')}render();
</script></body></html>
