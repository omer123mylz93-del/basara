function syllables(word){if(word==='İsa’ya'||word==="İsa'ya")return [word.slice(0,1),word.slice(1,3),word.slice(3)];const v=[];for(let i=0;i<word.length;i++)if('aeıioöuüAEIİOÖUÜ'.includes(word[i]))v.push(i);const b=[0];for(let i=1;i<v.length;i++)b.push(Math.max(v[i-1]+1,v[i]-1));b.push(word.length);return b.slice(1).map((x,i)=>word.slice(b[i],x)).filter(Boolean)}

function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}let flashBase=false;function startDeck(k,b=false){kind=k;flashBase=b;colorDeck=b?(baseColor&&!k.startsWith('dict')):colorTeaching;deck=shuffle((b?base[k]:getDay()[k]).map((text,i)=>({text,i})));pos=0;flashResults=[];go('student')}function student(){if(!deck.length)return `<div class="panel"><h2>Öğrenci kartları</h2><p>Bir ders veya başlangıç testi seç. Kartlar rastgele sırada ve büyük yazıyla gösterilir. Ders kartlarında renk seçilebilir; başlangıç testinde renk destekli kayıtlar bağımsız kayıtlardan ayrıdır.</p><div class="buttons"><button onclick="go('plan')">Ders seç</button><button onclick="go('baseline')">Başlangıç testi</button></div></div>`;if(pos>=deck.length){let s=score(flashResults.map(x=>x.v));return `<div class="panel"><h2>Oturum tamamlandı</h2><div class="big">${s.good}/${s.n}</div><p>${flashBase&&colorDeck?'Renk destekli doğru':'Bağımsız doğru'} · %${pct(s.good,s.n)}</p><p>Tekrar: ${esc(flashResults.filter(x=>x.v!=='+').map(x=>x.text).join(', '))}</p><div class="buttons"><button onclick="startDeck('${kind}',${flashBase})">Yeniden karıştır</button><button onclick="go('${flashBase?'baseline':'track'}')">Kayıtlara dön</button></div><p class="muted">${flashBase?'Başlangıç formuna işlendi.':'Takip alanına geçerek bu sonucu ve diğer becerileri ayrı kaydet.'}</p></div>`}const x=deck[pos],isDict=kind.startsWith('dict');return `<div class="panel"><div class="buttons noprint"><button onclick="go('${flashBase?'baseline':'plan'}')">Öğretmen paneline dön</button><span class="muted">${pos+1}/${deck.length}</span></div><div class="progress"><span style="width:${pos/deck.length*100}%"></span></div>${!flashBase&&!isDict?colorSwitch(true):''}<div class="flash plain ${x.text.length>12?'small':''}" style="margin:18px 0"><div class="flashtext">${isDict?'Dinle ve yaz':colorText(x.text,colorDeck)}</div></div>${isDict?`<details><summary>Öğretmen için dikte maddesi (öğrenci görmemeli)</summary><h3>${esc(x.text)}</h3></details>`:''}<div class="buttons">${options.slice(1).map(([v,t])=>`<button class="${v==='+'?'primary':''}" onclick="markFlash('${v}')">${flashBase&&colorDeck&&v==='+'?'Renk destekli doğru':t}</button>`).join('')}<button onclick="pos++;render()">Atla</button></div><p class="muted">Renkli kart öğretim desteğidir; ölçüt yoklaması için tek renk kullan. Öğretmen ilk bağımsız tepkiyi işaretler. Öğrenciye cevabı verdikten sonraki tepkiyi bağımsız doğru saymayın.</p></div>`}function markFlash(v){let x=deck[pos];flashResults.push({text:x.text,v});if(flashBase){state.baseline[baseKey(kind,x.i,colorDeck)]=v;save()}else{recordHWPractice(x,v)}pos++;render()}
function track(){const d=getDay(),logs=state.logs.slice().reverse();return `<div class="panel"><h2>Günlük beceri kaydı</h2><p>Seçili ders: <b>${week}. hafta / ${day}. gün — ${esc(d.title)}</b></p><div class="buttons"><button onclick="go('plan')">Ders değiştir</button></div><label>Tarih</label><input id="logdate" type="date" value="${today()}"><label>Hedef grup (iki günlük karşılaştırmada aynı kodu kullan)</label><input id="group" value="${esc(d.heces.join(' '))}"><div class="tablewrap"><table><thead><tr><th>Beceri</th><th>Doğru</th><th>Denenen</th></tr></thead><tbody>${Object.entries(labels).map(([k,l])=>`<tr><td>${l}</td><td><input id="g_${k}" type="number" min="0" max="100" style="width:72px" placeholder="—"></td><td><input id="n_${k}" type="number" min="1" max="100" style="width:72px" placeholder="—"></td></tr>`).join('')}</tbody></table></div><label>Hatalar / ipucu düzeyi</label><textarea id="err" placeholder="Örn. ba ile sa karışıyor; masa yerine mama..."></textarea><button class="primary" onclick="addLog()">Yoklamayı kaydet</button><button onclick="openHW(getDay().id,$('logdate').value||today())">Bu dersten ödev hazırla</button><p class="muted">Yalnız bağımsız doğruları say. Denenmeyen alanı boş bırak. Ölçüt değerlendirmesi için en az 10 hece/kelime; cümle/anlama/transfer için en az 5 madde.</p></div><div class="panel"><h3>Tekrar ve kalıcılık</h3><label>Madde / hedef</label><input id="retItem" placeholder="ba, sa / masa"><label>İlk öğretim tarihi</label><input id="retDate" type="date" value="${today()}"><div class="buttons"><button onclick="addRetention()">1, 3, 7, 14 günlük tekrar oluştur</button></div>${state.retention.map((r,i)=>`<div class="soft" style="margin:8px 0">${esc(r.item)} · ${esc(r.date)} · ${r.offset}. gün <select aria-label="Kalıcılık sonucu" onchange="state.retention[${i}].result=this.value;save();render()">${[['','Bekliyor'],['+','Bağımsız doğru'],['-','Yanlış'],['I','İpucuyla'],['C','Cevap yok']].map(([v,t])=>`<option value="${v}" ${v===r.result?'selected':''}>${t}</option>`).join('')}</select> ${r.date<=today()&&!r.result?' • Bugün veya gecikmiş':''}</div>`).join('')}</div><div class="panel"><h3>Ölçüt kontrolü</h3>${gateStatus()}<p class="muted">Aynı hedef grubunda farklı iki tarihte yeterli veri aranır. Geçiş kararı öğretmene aittir; cümle ve transfer sonuçları da kontrol edilmelidir.</p></div><div class="panel"><h3>Kayıt geçmişi</h3>${logs.length?logs.map(l=>`<details><summary>${esc(l.date)} · Ders ${l.day} · ${esc(l.group)}</summary>${Object.entries(l.scores).map(([k,s])=>`<p>${labels[k]}: <b>${s.g}/${s.n} (%${pct(s.g,s.n)})</b></p>`).join('')}<p>${esc(l.err)}</p><button onclick="deleteLog(${l.id})">Kaydı sil</button><button onclick="openHW(${l.day},'${esc(l.date)}')">Bu kayıttan ödev hazırla</button></details>`).join(''):'Henüz kayıt yok.'}<div class="buttons"><button onclick="window.print()">Raporu yazdır / PDF kaydet</button></div></div>`}function addLog(){let scores={};for(let k of Object.keys(labels)){let a=$('g_'+k).value,b=$('n_'+k).value;if(a===''&&b==='')continue;let g=Number(a),n=Number(b);if(a===''||b===''||!Number.isInteger(g)||!Number.isInteger(n)||g<0||n<1||g>n||n>100){alert(labels[k]+' için geçerli doğru ve denenen sayı gir.');return}scores[k]={g,n}}if(!Object.keys(scores).length||!$('logdate').value||!$('group').value.trim()){alert('Tarih, hedef ve en az bir beceri gerekli.');return}state.logs.push({id:Date.now(),date:$('logdate').value,day:getDay().id,group:$('group').value.trim(),scores,err:$('err').value});save();render()}function deleteLog(id){if(confirm('Bu kayıt silinsin mi?')){state.logs=state.logs.filter(l=>l.id!==id);save();render()}}function gateStatus(){if(!state.logs.length)return '<p>İki günlük ölçüt için kayıt gerekli.</p>';let grp=state.logs.at(-1).group,ls=state.logs.filter(l=>l.group===grp);let html=`<p>Son hedef: <b>${esc(grp)}</b></p>`;for(let [k,label] of Object.entries(labels)){let min=['sentences','dictS','meaning','transfer'].includes(k)?5:10,threshold=['heces','words'].includes(k)?90:80;let by={};ls.forEach(l=>{if(l.scores[k])by[l.date]=l.scores[k]});let a=Object.entries(by).sort((a,b)=>a[0].localeCompare(b[0])).slice(-2);let pass=a.length===2&&a.every(([,s])=>s.n>=min&&pct(s.g,s.n)>=threshold);html+=`<p>${label}: ${pass?'✓ İki günlük ölçüt karşılandı':a.length?'Tekrar / ek yoklama gerekli':'Henüz ölçülmedi'} ${a.map(([date,s])=>`${esc(date)} ${s.g}/${s.n}`).join(' · ')}</p>`}return html}function addRetention(){let item=$('retItem').value.trim(),date=$('retDate').value;if(!item||!date){alert('Hedef ve tarih girin.');return}for(let offset of [1,3,7,14]){let dt=new Date(date+'T12:00:00');dt.setDate(dt.getDate()+offset);state.retention.push({item,date:dt.toLocaleDateString('sv-SE'),offset,result:''})}save();render()}
function backup(){return `<div class="panel"><h2>Yedekleme ve gizlilik</h2><p>Sunucu hesabı yoktur. Kayıtlar bu tarayıcı ve adresle sınırlıdır; gizli sekmede veya geçmiş temizlendiğinde silinebilir. Yedeği düzenli indirin. Gerçek ad, fotoğraf veya sağlık bilgisi yazmayın. Yedek dosyalarını güvenli saklayın.</p><div class="buttons"><button class="primary" onclick="download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'basara-yedek.json')">JSON yedek indir</button><button onclick="exportCSV()">Kayıtları CSV indir</button></div><label>Yedekten geri yükle (mevcut verilerin yerini alır)</label><input type="file" accept=".json,application/json" onchange="restore(this)"><div class="buttons"><button class="danger" onclick="if(confirm('Bu cihazdaki bütün kayıtlar silinsin mi?')){state=defaults();save();render()}">Yerel verileri sil</button></div></div><div class="panel"><h3>Web sitesinde yayınlama</h3><p>index.html dosyasını bir statik web sunucusuna veya GitHub Pages'e yükleyin. GitHub: Settings → Pages → Deploy from a branch → main / root. Uygulama bağlantısı oluşturulduğunda farklı cihazlarda açılır; kayıtlar otomatik senkronize olmaz.</p><p>Haftalık PDF'ler dosyaya gömülüdür. İnternet olmadan da indirilebilir.</p></div>`}async function restore(input){try{let s=JSON.parse(await input.files[0].text());if(!s||typeof s.code!=='string'||!Array.isArray(s.logs)||!Array.isArray(s.retention)||typeof s.baseline!=='object'||typeof s.notes!=='object'||s.logs.some(l=>!l||typeof l.date!=='string'||typeof l.group!=='string'||!l.scores||!Object.values(l.scores).every(v=>v&&Number.isFinite(v.g)&&Number.isFinite(v.n))))throw Error();if(confirm('Mevcut kayıtların yerini bu yedek alsın mı?')){state={...defaults(),...s};save();render()}}catch(e){alert('Geçerli bir Basara yedeği seçin.')}}function exportCSV(){let safe=v=>{let s=String(v??'');if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};let rows=[['Tarih','Ders','Hedef','Beceri','Bağımsız doğru','Denenen','Not']];for(let l of state.logs)for(let [k,s] of Object.entries(l.scores))rows.push([l.date,l.day,l.group,labels[k],s.g,s.n,l.err]);download(new Blob(['\ufeff'+rows.map(r=>r.map(safe).join(';')).join('\n')],{type:'text/csv;charset=utf-8'}),'basara-kayit.csv')}
let hwDate=today(), hwDay=1, hwDraft=null;
const hwKinds={heces:'Hece okuma',words:'Kelime okuma',sentences:'Cümle okuma',copy:'Bakarak yazma',dictation:'Dikte'};
const hwLimits={heces:6,words:5,sentences:2,copy:3,dictation:3};
function hwKey(){return hwDate+'|'+hwDay}
function hwNew(){return {date:hwDate,day:hwDay,heces:[],words:[],sentences:[],copy:[],dictation:[],color:true,repeats:2,note:'',status:'Hazırlandı',feedback:''}}
function hwLoad(){let old=state.homeworks?.[hwKey()];hwDraft=old?{...hwNew(),...JSON.parse(JSON.stringify(old)),color:true}:hwNew()}
function openHW(id=getDay().id,date=today()){hwDay=id;hwDate=date;hwLoad();go('homework')}
function hwChange(){hwDate=$('hw-date').value||today();hwDay=Number($('hw-day').value);hwLoad();render()}
function hwPractice(k){return (state.practice||[]).filter(x=>x.date===hwDate&&x.day===hwDay&&x.kind===k).sort((a,b)=>(a.v==='+'?1:0)-(b.v==='+'?1:0))}
function hwPool(k){let d=DATA.days[hwDay-1];return k==='copy'?[...d.words,...d.heces]:k==='dictation'?d.dictation:d[k]||[]}
function hwSuggest(){hwCollect();let added=0;for(let k of ['heces','words','sentences']){let items=hwPractice(k).map(x=>x.text);if(items.length){hwDraft[k]=[...new Set(items)].slice(0,hwLimits[k]);added+=hwDraft[k].length}}if(!added){alert('Bu tarih ve ders için madde düzeyinde kart kaydı yok. Aşağıdaki ders listesinden gerçekten çalışılan maddeleri seçin.');return}render()}
function hwCollect(){if(!$('hw-heces'))return;for(let k of Object.keys(hwKinds))hwDraft[k]=[...new Set($('hw-'+k).value.split(/[\n;]+/).map(s=>s.trim()).filter(Boolean))];hwDraft.color=true;hwDraft.repeats=Number($('hw-repeats').value);hwDraft.note=$('hw-note').value.trim();hwDraft.status=$('hw-status').value;hwDraft.feedback=$('hw-feedback').value.trim()}
function hwColored(items){return items.length?items.map(t=>`<span>${colorText(t,true)}</span>`).join(''):'<span class="muted">Henüz madde seçilmedi.</span>'}
function hwLive(){hwCollect();for(const k of Object.keys(hwKinds)){const el=$('hw-selected-'+k);if(el)el.innerHTML=hwColored(hwDraft[k])}const paper=document.querySelector('.hw-paper');if(paper)paper.outerHTML=hwSheet(hwDraft)}
function hwAdd(k,i){hwCollect();let t=hwPool(k)[i];if(t&&!hwDraft[k].includes(t)){if(hwDraft[k].length>=hwLimits[k]){alert('Bu bölüm için en fazla '+hwLimits[k]+' madde.');return}hwDraft[k].push(t)}render()}
function hwSave(print=false){hwCollect();for(let k of Object.keys(hwKinds)){if(hwDraft[k].length>hwLimits[k]){alert(hwKinds[k]+' için en fazla '+hwLimits[k]+' madde.');return}if(hwDraft[k].some(x=>x.length>(k==='sentences'?100:45))){alert('Bir madde çok uzun; A4 için kısaltın.');return}}if(!Object.keys(hwKinds).some(k=>hwDraft[k].length)){alert('En az bir ödev maddesi ekleyin.');return}if(hwDraft.note.length>180){alert('Veli notunu 180 karakterle sınırlayın.');return}state.homeworks=state.homeworks||{};state.homeworks[hwKey()]=JSON.parse(JSON.stringify(hwDraft));save();render();if(print){document.body.classList.add('hw-printing');window.print();document.body.classList.remove('hw-printing')}else alert('Günlük ödev kaydedildi.')}
function hwDelete(){if(confirm('Bu günlük ödev silinsin mi?')){delete (state.homeworks||{})[hwKey()];hwLoad();save();render()}}
function hwSheet(h){let content='';const read=(k,title)=>h[k].length?`<section class="hw-section"><h3>${title}</h3><div class="hw-read ${k==='sentences'?'hw-sentences':''}">${h[k].map(t=>`<div>${colorText(t,true)}</div>`).join('')}</div></section>`:'';content+=read('heces','Heceleri oku.');content+=read('words','Kelimeleri oku.');content+=read('sentences','Cümleleri oku.');if(h.copy.length)content+=`<section class="hw-section"><h3>Bak ve yaz.</h3>${h.copy.map(t=>`<div class="hw-copy"><span>${colorText(t,true)}</span><span class="hw-line"></span></div>`).join('')}</section>`;if(h.dictation.length)content+=`<section class="hw-section"><h3>Dinle ve yaz.</h3>${h.dictation.map((_,i)=>`<div class="hw-copy"><span>${i+1}.</span><span class="hw-line"></span></div>`).join('')}<p class="hw-parent">Veliye: Bu satırı öğrenciye göstermeden sırayla söyleyin: ${h.dictation.map(t=>colorText(t,true)).join(' • ')}</p></section>`;return `<div class="panel hw-paper"><div class="eyebrow">BASARA · EV ÇALIŞMASI</div><h2>Günlük okuma ve yazma ödevi</h2><div class="hw-meta">Öğrenci: ${esc(state.code)} &nbsp; | &nbsp; Tarih: ${esc(h.date)}</div><p class="hw-parent">Okuma maddelerini ${h.repeats} kez oku. Zorlanırsan ara ver.</p>${content||'<p>Ödev maddelerini seçin ve önizlemeyi güncelleyin.</p>'}<div class="hw-parent hw-footer"><b>Veliye:</b> Yaklaşık 5–10 dakika çalışın. Önce bağımsız denemesine fırsat verin; zorlandığı maddeleri öğretmene bildirin.${h.note?`<p><b>Öğretmen notu:</b> ${esc(h.note)}</p>`:''}<p>Veli gözlemi: __________________________________________</p></div></div>`}
function homework(){if(!hwDraft)hwLoad();let h=hwDraft,d=DATA.days[hwDay-1],logs=state.logs.filter(l=>l.date===hwDate&&l.day===hwDay);let n=['heces','words','sentences'].reduce((a,k)=>a+hwPractice(k).length,0);let history=Object.values(state.homeworks||{}).sort((a,b)=>b.date.localeCompare(a.date)||b.day-a.day);return `<div class="panel noprint"><h2>Günlük ödev</h2><p>O gün gerçekten çalışılan maddeleri seçerek kısa bir ev çalışması hazırla.</p><div class="split"><div><label for="hw-date">Ödev tarihi</label><input id="hw-date" type="date" value="${esc(hwDate)}" onchange="hwChange()"></div><div><label for="hw-day">Çalışılan ders</label><select id="hw-day" onchange="hwChange()">${DATA.days.map(x=>`<option value="${x.id}" ${x.id===hwDay?'selected':''}>${x.week}. hafta / ${x.day}. gün — ${esc(x.title)}</option>`).join('')}</select></div></div>${logs.length?`<div class="soft"><b>Günlük yoklama kaydı:</b>${logs.map(l=>`<p>${esc(l.group)} · ${Object.entries(l.scores).map(([k,s])=>`${esc(labels[k]||k)} ${s.g}/${s.n}`).join(' · ')}${l.err?' — '+esc(l.err):''}</p>`).join('')}</div>`:'<p class="muted">Bu tarihte seçili ders için günlük yoklama kaydı bulunmuyor.</p>'}${state.notes[d.id]?`<p class="muted">Ders notu (tarihsiz): ${esc(state.notes[d.id])}</p>`:''}<div class="buttons"><button onclick="hwSuggest()" ${n?'':'disabled'}>Bugünkü kartlardan ödev öner (${n} madde)</button></div><p class="muted">Kart önerisi, yeni sürümde işaretlenen okuma maddelerinden önce zorlanılanları seçer. Eski yoklama kayıtları yalnız toplam puan içerir; aşağıdaki plan listesinden çalışılanları elle seçebilirsiniz.</p>${Object.entries(hwKinds).map(([k,title])=>`<details open><summary>${title} · en fazla ${hwLimits[k]} madde</summary><div class="buttons hw-pool">${hwPool(k).map((t,i)=>`<button onclick="hwAdd('${k}',${i})">${colorText(t,true)}</button>`).join('')||'<span class="muted">Plan listesi yok; elle ekleyebilirsiniz.</span>'}</div><label for="hw-${k}">Seçilen maddeler (her satıra bir madde)</label><textarea id="hw-${k}" rows="${Math.min(hwLimits[k],4)}" placeholder="İsterseniz kendiniz yazın" oninput="hwLive()">${esc(h[k].join('\n'))}</textarea><div class="hw-selected" id="hw-selected-${k}">${hwColored(h[k])}</div></details>`).join('')}<div class="split"><div><p class="muted"><b>Renkli hece desteği açık:</b> Seçim listesi, okuma, bakarak yazma ve PDF çıktısı kırmızı / siyah gösterilir. Yazı alanının altında renkli önizleme bulunur.</p></div><div><label>Okuma tekrar sayısı</label><select id="hw-repeats">${[1,2,3].map(i=>`<option ${h.repeats===i?'selected':''}>${i}</option>`).join('')}</select></div></div><label>Veliye özel not (isteğe bağlı)</label><textarea id="hw-note" maxlength="180">${esc(h.note)}</textarea><label>Ödev durumu</label><select id="hw-status">${['Hazırlandı','Verildi','Tamamlandı','Eksik / tekrar gerekli'].map(s=>`<option ${s===h.status?'selected':''}>${s}</option>`).join('')}</select><label>Ödev dönüşü / öğretmen değerlendirmesi (çıktıda görünmez)</label><textarea id="hw-feedback">${esc(h.feedback)}</textarea><div class="buttons"><button onclick="hwSave()">Ödevi kaydet / önizle</button><button class="primary" onclick="hwSave(true)">A4 yazdır / PDF kaydet</button>${state.homeworks?.[hwKey()]?'<button class="danger" onclick="hwDelete()">Ödevi sil</button>':''}</div></div>${hwSheet(h)}<div class="panel noprint"><h3>Ödev geçmişi</h3>${history.length?history.map(x=>`<div class="soft" style="margin:8px 0"><b>${esc(x.date)}</b> · Ders ${x.day} · ${esc(x.status)} <button onclick="openHW(${Number(x.day)},'${esc(x.date)}')">Aç / düzenle</button></div>`).join(''):'Henüz kayıtlı ödev yok.'}</div>`}
function recordHWPractice(x,v){if(!['heces','words','sentences'].includes(kind))return;state.practice=state.practice||[];let row={date:today(),day:getDay().id,kind,text:x.text,v,color:colorDeck};let i=state.practice.findIndex(p=>p.date===row.date&&p.day===row.day&&p.kind===row.kind&&p.text===row.text);if(i>=0)state.practice[i]=row;else state.practice.push(row);save()}

render();
</script></body></html>
